<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two players, one page · a Joinable demo</title>
  <link rel="icon" href="/brand/favicon.ico" sizes="32x32">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0A24; color: #F4F1FF; font: 400 14px/1.4 'Geist', system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    header b { font-size: 16px; font-weight: 600; }
    header span { opacity: .7; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; gap: 8px; padding: 0 8px 8px; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #000; }
  </style>
</head>
<body>
  <header><b>Bubble Pop, two players</b><span>Each frame is a separate player in the same room. Pop bubbles in either one.</span></header>
  <main id="frames"></main>
  <script>
    const room = Math.random().toString(36).slice(2, 8);
    for (let i = 0; i < 2; i++) {
      const f = document.createElement('iframe');
      f.src = `/examples/bubbles/?join=${room}`;
      f.title = `Player ${i + 1}`;
      document.getElementById('frames').appendChild(f);
    }
  </script>
</body>
</html>
